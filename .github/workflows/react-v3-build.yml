name: React V3 Quality Gate
on:
  push:
    branches: [react-v3-migration]
  pull_request:
    branches: [drixel-v2-architecture]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: react-v3-phone-preview-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm --prefix functions install --no-audit --no-fund
      - run: npm --prefix worker ci --no-audit --no-fund
      - run: npm --prefix worker test
      - run: npm --prefix worker run check
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm test
      - run: node -e 'require("./functions/index.js")'
      - run: npm run test:rules
      - run: npx firebase emulators:exec --only firestore --project demo-drixel "node worker/test/firestore-emulator.mjs"
      - run: npm run test:storage
      - run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      - run: npx playwright install chromium --with-deps
      - name: Verify React storefront alignment
        run: |
          npm run dev -- --host 127.0.0.1 >/tmp/drixel-vite.log 2>&1 &
          VITE_PID=$!
          trap 'kill "$VITE_PID"' EXIT
          node -e 'const wait=async()=>{for(let i=0;i<100;i++){try{await fetch("http://127.0.0.1:5173/");return}catch{}await new Promise(r=>setTimeout(r,100))}process.exit(1)};wait()'
          npm run test:layout
          npm run test:admin
          npm run test:marketing
          node tests/product-media-browser.cjs
      - name: Verify campaign send safeguards
        run: node --test tests/admin-campaign.cjs tests/campaign-engine.cjs tests/storefront-resilience.test.js
      - name: Verify Firebase hosting output
        run: test -f dist/index.html
      - name: Verify critical React source
        run: |
          test -f src/app/App.jsx
          test -f src/admin-react/AdminRouter.jsx
          test -f src/react-pages/Checkout.jsx
          test -f src/pages/za/admin/settings/markets/index.jsx
      - name: Package phone preview
        if: github.event_name == 'push'
        run: tar -czf drixel-react-v3-preview.tar.gz -C dist .
      - name: Upload phone preview artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: drixel-react-v3-preview
          path: drixel-react-v3-preview.tar.gz
          retention-days: 7
      - name: Configure GitHub Pages
        if: github.event_name == 'push'
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy-preview:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy React V3 phone preview
        id: deployment
        uses: actions/deploy-pages@v4
