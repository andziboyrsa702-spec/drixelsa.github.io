name: React V3 Quality Gate
on:
  push:
    branches: [react-v3-migration]
  pull_request:
    branches: [drixel-v2-architecture]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Verify Firebase hosting output
        run: test -f dist/index.html
      - name: Verify critical React source
        run: |
          test -f src/app/App.jsx
          test -f src/admin-react/AdminRouter.jsx
          test -f src/react-pages/Checkout.jsx
          test -f src/pages/za/admin/settings/markets/index.jsx
