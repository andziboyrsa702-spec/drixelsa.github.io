name: Fix functions body-parser lockfile

on:
  push:
    branches: [react-v3-migration]
    paths:
      - '.github/workflows/fix-functions-body-parser.yml'
      - 'functions/package.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: react-v3-migration
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate functions lockfile
        run: npm --prefix functions install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify production audit
        run: npm --prefix functions audit --omit=dev
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add functions/package-lock.json
          git diff --cached --quiet || git commit -m "Update functions lockfile for body-parser patch"
          git push origin HEAD:react-v3-migration
