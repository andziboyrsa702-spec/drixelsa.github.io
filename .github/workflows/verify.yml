name: Verify storefront and commerce
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci && npm ci --prefix functions
      - run: npm test && npm run check
      - run: npm run test:rules
      - run: npx playwright install chromium --with-deps
      - name: Isolated browser checkout checks
        run: |
          python3 -m http.server 8765 >/tmp/drixel-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          node -e 'const wait=async()=>{for(let i=0;i<50;i++){try{await fetch("http://127.0.0.1:8765/");return}catch{}await new Promise(r=>setTimeout(r,100))}process.exit(1)};wait()'
          npm run test:browser
