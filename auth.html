<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in | Drixel SA</title><meta name="description" content="Sign in or create your Drixel SA account."><link rel="stylesheet" href="/src/styles/tokens.css"><link rel="stylesheet" href="/src/styles/auth.css"></head><body><main class="auth-shell"><section class="auth-brand"><a href="/" class="auth-wordmark">DRIXEL</a><div><p>DRIXEL SA / ACCOUNT</p><h1>Your streets.<br>Your account.</h1><span>Sign in to checkout securely, view orders and follow fulfilment.</span></div><a href="/products.html" class="auth-shop">Continue shopping →</a></section><section class="auth-card"><div class="auth-tabs"><button class="active" data-tab="login">Sign in</button><button data-tab="register">Create account</button></div><div id="authMessage" class="auth-message" hidden></div><form id="loginForm"><h2>Welcome back</h2><label>Email<input id="loginEmail" type="email" autocomplete="email" required></label><label>Password<input id="loginPassword" type="password" autocomplete="current-password" required></label><button class="auth-primary">Sign in</button><button class="auth-link" id="forgotPassword" type="button">Forgot password?</button></form><form id="registerForm" hidden><h2>Create your Drixel account</h2><label>Full name<input id="registerName" autocomplete="name" required maxlength="120"></label><label>Email<input id="registerEmail" type="email" autocomplete="email" required maxlength="254"></label><label>Phone <small>optional</small><input id="registerPhone" type="tel" autocomplete="tel" maxlength="30"></label><label>Password<input id="registerPassword" type="password" autocomplete="new-password" required minlength="8"></label><label>Confirm password<input id="registerConfirm" type="password" autocomplete="new-password" required minlength="8"></label><label class="auth-check"><input id="registerSubscribe" type="checkbox"> <span>Send me Drixel collection and product updates.</span></label><button class="auth-primary">Create account</button></form><div class="auth-divider"><span>or</span></div><button id="googleAuth" class="auth-google">Continue with Google</button><p class="auth-legal">By creating an account you agree to Drixel's <a href="/help/a/terms-of-use/index.html">terms</a> and <a href="/help/a/privacy-policy/index.html">privacy policy</a>.</p></section></main><script type="module" src="/src/pages/auth.js"></script></body></html>
