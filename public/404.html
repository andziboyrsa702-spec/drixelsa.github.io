<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#111111"><title>Opening DRIXEL</title><link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png"><style>

</style></head><body><main><section class="dx-recovery" aria-label="DRIXEL page loading"><div class="dx-logo"><img src="/favicon-32x32.png" alt="">DRIXEL</div><div class="dx-eyebrow">SECURE ACCOUNT ACCESS</div><h1>Taking you to DRIXEL.</h1><p>We're opening your requested page. If it doesn't open automatically, use the button below to continue safely.</p><div class="dx-actions"><a id="continue" href="/za/member/login/">Continue to sign in</a><a href="/za">Return to the store</a></div><small>Your shopping bag and payment status are not changed.</small></section></main><script>
(function(){
 const path=location.pathname+location.search+location.hash;
 const target='/?__drixel_route='+encodeURIComponent(path);

 // GitHub Pages returns this fallback for ungenerated routes. Restore the exact route in the SPA.
 if(location.pathname!=='/'&& !new URLSearchParams(location.search).has('__drixel_route'))location.replace(target);
})();
